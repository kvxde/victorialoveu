<link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+SC:wght@400;500&family=Nunito+Sans:wght@400;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#120909;--bg2:#1c0f0f;--red:#c8161d;--red2:#e8473a;--gold:#dcb673;--txt:#f3e9e1;--mut:#b5a49b;--ln:#3a1a1a;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--txt);font:400 17px/1.7 'Nunito Sans','Noto Sans SC',system-ui,sans-serif;overflow-x:hidden}
.cn{font-family:'Ma Shan Zheng','Noto Sans SC',serif}
h1,h2,h3{font-family:'Playfair Display','Noto Sans SC',Georgia,serif;font-weight:700;line-height:1.2}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 5vw;background:rgba(18,9,9,.94);backdrop-filter:blur(8px);border-bottom:1px solid var(--ln)}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:42px;height:42px;object-fit:contain}
.brand b{font:700 22px 'Playfair Display','Noto Sans SC',serif}
.hr{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
nav a,.lg{padding:7px 16px;border-radius:99px;transition:.25s;font-size:16px}
nav a:hover{color:var(--gold)}
nav a.on{background:var(--red)}
.lg{border:1px solid var(--ln);background:none;color:var(--txt);cursor:pointer;font-family:inherit}
.lg:hover{border-color:var(--gold)}.lgm{display:none}
.btn{display:inline-block;padding:12px 26px;border-radius:99px;background:var(--red);border:1px solid var(--red);font:600 16px inherit;font-family:inherit;cursor:pointer;color:#fff;transition:.25s}
.btn:hover{background:var(--red2);transform:translateY(-2px);box-shadow:0 8px 24px rgba(200,22,29,.4)}
.btn.o{background:none;border-color:var(--gold);color:var(--gold)}
.btn.o:hover{background:var(--gold);color:#000;box-shadow:none}
.page{display:none}.page.on{display:block}
.hero{position:relative;min-height:calc(100vh - 66px);display:grid;place-content:center;justify-items:center;text-align:center;padding:60px 5vw;overflow:hidden;background:radial-gradient(ellipse at 50% 35%,#471012 0%,var(--bg) 65%)}
.hero .logo{width:min(440px,84vw);height:auto;position:relative;z-index:1;filter:drop-shadow(0 0 26px rgba(200,22,29,.4));animation:rise 1.1s .1s both cubic-bezier(.2,.8,.2,1)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.hero .logo{margin-bottom:14px}
.hero .cnt{font-size:clamp(34px,6vw,56px);color:var(--red2);margin-bottom:18px;animation:rise 1.1s .5s both cubic-bezier(.2,.8,.2,1)}
.hero p{max-width:540px;margin-bottom:28px;color:var(--mut);animation:rise 1.1s .7s both}
.acts{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;animation:rise 1.1s .85s both}
.ember{position:absolute;bottom:-10px;width:5px;height:5px;border-radius:50%;background:var(--red2);opacity:0;animation:float linear infinite}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@keyframes float{0%{opacity:0}15%{opacity:.8}100%{opacity:0;transform:translate(30px,-70vh)}}
section.s{padding:80px 5vw;max-width:1100px;margin:0 auto}
.s h2{font-size:clamp(32px,5vw,46px);margin-bottom:24px}
.about p{max-width:70ch}.about p+p{margin-top:14px;color:var(--mut)}
.vals{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:36px}
.val{padding:22px;border-left:3px solid var(--red);background:var(--bg2);transition:.3s}
.val:hover{border-color:var(--gold);transform:translateX(4px)}
.val h3{font-size:22px;margin-bottom:4px}
.val p{font-size:15px;color:var(--mut)}
.contact{display:grid;grid-template-columns:1fr 1fr;gap:40px;background:var(--bg2);padding:34px;border:1px solid var(--ln);border-radius:8px}
.contact ul{list-style:none;padding:0;display:grid;gap:14px;margin:0 0 22px}
.contact li small{display:block;color:var(--gold);font-size:14px}
.contact li a:hover{color:var(--red2)}
.row{display:flex;gap:10px;flex-wrap:wrap}
form,.fm{display:grid;gap:12px}
input,select{width:100%;padding:12px 14px;background:var(--bg);border:1px solid #4a2222;border-radius:8px;color:var(--txt);font:inherit}
input:focus,select:focus{border-color:var(--red2);outline:none}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
#ok{display:none;padding:14px;border:1px solid var(--gold);color:var(--gold);border-radius:8px}
.mh{padding:64px 5vw 16px;text-align:center;background:radial-gradient(ellipse at 50% 0,#3b0d0f,var(--bg) 70%)}
.mh .cn{font-size:44px;color:var(--red2)}
.mh h1{font-size:clamp(42px,8vw,72px)}
.mh small{color:var(--gold);font-size:15px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:24px}
.tab{padding:8px 20px;border-radius:99px;border:1px solid #5a2424;background:none;color:var(--txt);cursor:pointer;font:inherit;font-size:15px;transition:.25s}
.tab:hover{border-color:var(--gold)}
.tab.on{background:var(--red);border-color:var(--red)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:20px}
.dish{position:relative;background:var(--bg2);border:1px solid var(--ln);border-radius:8px;overflow:hidden;transition:.3s;animation:rise .6s both}
.dish:hover{transform:translateY(-5px);border-color:var(--red)}
.ph{height:170px;display:grid;place-items:center;font-size:58px;background:radial-gradient(circle at 50% 40%,#5a1517,#240c0c);overflow:hidden}
.ph img{width:100%;height:100%;object-fit:cover}
.dish .b{padding:20px 22px 22px}
.dish .cn{color:var(--red2);font-size:22px}
.dish h3{font-size:23px}
.dish .p{color:var(--gold);font-size:14px;margin:2px 0 8px}
.dish p.d{color:var(--mut);font-size:15px}
.f{display:flex;justify-content:space-between;align-items:center;margin-top:16px}
.price{font:700 24px 'Playfair Display',serif}
.add{padding:7px 16px;border-radius:99px;border:1px solid var(--red2);background:none;color:var(--txt);cursor:pointer;font:inherit;font-size:14px;transition:.2s}
.add:hover{background:var(--red)}
.hit{position:absolute;top:12px;right:12px;z-index:1;font-size:13px;background:var(--red);padding:1px 12px;border-radius:99px}
.cart{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translate(-50%,160%);z-index:30;display:flex;align-items:center;gap:16px;padding:10px 12px 10px 22px;background:#260c0c;border:1px solid var(--red);border-radius:99px;box-shadow:0 10px 40px #000;transition:.4s;max-width:94vw}
.cart.on{transform:translate(-50%,0)}
.ov{position:fixed;inset:0;z-index:40;background:rgba(0,0,0,.7);display:none;place-items:center;padding:16px}
.ov.on{display:grid}
.dr{width:min(480px,100%);max-height:90vh;overflow:auto;background:var(--bg2);border:1px solid var(--red);border-radius:12px;padding:24px;display:grid;gap:14px}
.dr h3{font-size:28px}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:15px;border-bottom:1px solid var(--ln);padding-bottom:8px}
.q{display:flex;align-items:center;gap:8px;white-space:nowrap}
.q button{width:28px;height:28px;border-radius:50%;border:1px solid var(--red2);background:none;color:var(--txt);cursor:pointer;font-size:16px}
.tot{display:flex;justify-content:space-between;font:700 22px 'Playfair Display',serif}
.lan{position:absolute;top:-6px;z-index:0;pointer-events:none;transform-origin:50% 0;animation:swing 4.4s ease-in-out infinite alternate,glow 3s ease-in-out infinite alternate}
.lan.a{left:6%;width:clamp(54px,9vw,104px)}.lan.b{right:6%;width:clamp(46px,7.5vw,88px);animation-duration:5.2s,3.6s;animation-delay:-1.8s,-1s}
@keyframes swing{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}
@keyframes glow{from{filter:drop-shadow(0 0 6px rgba(232,71,58,.35))}to{filter:drop-shadow(0 0 22px rgba(255,90,60,.85))}}
.stats{display:flex;gap:40px;margin-top:28px;flex-wrap:wrap}.stats b{display:block;font:700 46px 'Playfair Display',serif;color:var(--red2);line-height:1}.stats span{color:var(--mut);font-size:15px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:20px}
.chef{background:var(--bg2);border:1px solid var(--ln);border-radius:8px;overflow:hidden;transition:.3s}.chef:hover{border-color:var(--red);transform:translateY(-4px)}
.slot{display:grid;place-items:center;text-align:center;aspect-ratio:4/3;border:1px dashed #6a2a2a;border-radius:6px;background:radial-gradient(circle at 50% 40%,#3a1213,#1c0c0c);color:var(--mut);font-size:14px;overflow:hidden}.slot img{width:100%;height:100%;object-fit:cover}
.chef .slot{aspect-ratio:1;border:0;border-radius:0;border-bottom:1px dashed #6a2a2a}
.chef .b{padding:18px 20px 22px}.chef h3{font-size:24px}.chef .r{color:var(--gold);font-size:14px}.chef .x{display:inline-block;margin:8px 0;padding:2px 12px;border-radius:99px;background:var(--red);font-size:13px}.chef p{color:var(--mut);font-size:15px}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.gal figure{margin:0}.gal figcaption{font-size:14px;color:var(--mut);margin-top:6px}
.jobs{display:grid;gap:22px;max-width:860px;margin:auto}.job{background:var(--bg2);border:1px solid var(--ln);border-left:3px solid var(--red);border-radius:8px;padding:26px}.job h3{font-size:28px}.job .sal{font:700 24px 'Playfair Display',serif;color:var(--gold);margin:4px 0}.job .g{color:var(--mut);font-size:15px}.job h4{font-size:15px;color:var(--gold);margin:16px 0 4px;font-family:inherit}.job ul{padding-left:20px;color:var(--mut);font-size:15px}.job .row{margin-top:20px}
.cons{display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--mut);line-height:1.5;cursor:pointer}.cons input{width:18px;height:18px;margin-top:2px;flex:none;accent-color:#c8161d}.cons a,footer a{color:var(--gold);text-decoration:underline}
.doc{width:min(720px,100%)!important;font-size:14px;line-height:1.6;color:var(--mut)}.doc h3{font-size:24px;color:var(--txt)}.doc h4{font-size:16px;color:var(--txt);margin:12px 0 2px;font-family:inherit}.doc ul{padding-left:20px}.doc mark{background:#dcb67333;color:var(--gold);padding:0 3px}#dv{z-index:60}
footer{padding:30px 5vw;text-align:center;color:var(--mut);font-size:14px;border-top:1px solid var(--ln)}
@media(max-width:760px){.contact,.vals{grid-template-columns:1fr}.contact{padding:22px}
header{flex-direction:column;gap:6px;padding:8px 3vw}
.brand img{width:34px;height:34px}.brand b{font-size:20px;white-space:nowrap}
.hr{width:100%;justify-content:center;gap:4px}
nav{flex-wrap:nowrap;gap:2px}
nav a,.lg{padding:6px 10px;font-size:14px;white-space:nowrap}
.hero{min-height:calc(100svh - 96px);padding:40px 5vw 70px}
section.s{padding:56px 5vw}
#lg{display:none}
.lgm{display:block;position:fixed;left:12px;bottom:calc(14px + env(safe-area-inset-bottom,0px));z-index:35;background:#260c0c;border:1px solid var(--red);padding:10px 16px;font-size:15px;box-shadow:0 6px 20px #000}
header{transition:transform .3s}header.hide{transform:translateY(-100%)}
.cart{bottom:calc(72px + env(safe-area-inset-bottom,0px))}}
@media(max-width:360px){nav a,.lg{padding:6px 8px;font-size:13px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<template id="pv"><h3>Политика в отношении обработки персональных данных</h3><p><i>Редакция от 15.10.2026</i></p>
<h4>1. Общие положения</h4><p>Настоящая Политика разработана в соответствии с Федеральным законом от 27.07.2006 № 152-ФЗ «О персональных данных» и определяет порядок обработки персональных данных пользователей сайта ресторана «Красный тигр» (далее — Сайт).</p>
<h4>2. Оператор</h4><p>Оператор: <mark>[полное наименование юридического лица или ФИО ИП, ИНН, ОГРН/ОГРНИП, адрес]</mark>. По вопросам обработки данных: hello@redtiger.example, +7 (495) 000-00-00.</p>
<h4>3. Цели обработки</h4><p>Бронирование столов; приём и выполнение заказов; связь с пользователем для подтверждения брони или заказа.</p>
<h4>4. Состав данных</h4><p>Имя, номер телефона, дата бронирования, количество гостей, состав заказа. Специальные категории и биометрические персональные данные не обрабатываются.</p>
<h4>5. Правовое основание</h4><p>Согласие субъекта персональных данных (п. 1 ч. 1 ст. 6 152-ФЗ). Согласие даётся отдельно, проставлением отметки в форме на Сайте, и оформлено отдельным документом.</p>
<h4>6. Действия с данными</h4><p>Сбор, запись, систематизация, накопление, хранение, уточнение, использование, удаление и уничтожение, с использованием средств автоматизации и без них.</p>
<h4>7. Сроки обработки</h4><p>До достижения целей обработки либо до отзыва согласия пользователем.</p>
<h4>8. Передача третьим лицам</h4><p>Данные не передаются третьим лицам, кроме случаев, предусмотренных законом. Если пользователь отправляет заказ через мессенджер Telegram, он сам инициирует передачу сообщения, дальше оно обрабатывается по правилам этого сервиса.</p>
<h4>9. Хранение и защита</h4><p>Запись, систематизация, накопление, хранение, уточнение и извлечение персональных данных граждан РФ осуществляются с использованием баз данных на территории РФ (ч. 5 ст. 18 152-ФЗ). Оператор принимает правовые, организационные и технические меры для защиты данных (ст. 18.1 и 19 152-ФЗ).</p>
<h4>10. Права пользователя</h4><p>Пользователь вправе получить информацию об обработке своих данных, требовать их уточнения, блокирования или уничтожения, отозвать согласие, а также обжаловать действия оператора в Роскомнадзоре или в суде. Запрос или отзыв согласия направляется на hello@redtiger.example.</p>
<h4>11. Изменения Политики</h4><p>Оператор вправе изменять Политику. Актуальная редакция размещена на Сайте.</p></template>

<li><b>Отзыв:</b> в любое время письмом на hello@redtiger.example; после получения отзыва оператор прекращает обработку в срок, установленный законом.</li></ul>
<p>Согласие даётся проставлением отметки в форме на Сайте. Порядок обработки данных описан в Политике конфиденциальности.</p></template>

{img:"",ru:["Алексей Орлов","Повар горячего цеха","9 лет стажа","Работает с шефом Ли с первого дня, знает всё про утку по-пекински."],zh:["阿列克谢·奥尔洛夫","热菜厨师","从业9年","从开业第一天起与李主厨共事，精通北京烤鸭。"]}];
const GL=[["Основной зал","主厅"],["Банкетный зал","宴会厅"],["Открытая кухня","开放式厨房"],["Барная стойка","吧台"],["Летняя веранда","夏季露台"],["Входная группа","入口"]].map(x=>({img:"",ru:x[0],zh:x[1]}));
const J=[{ru:{t:"Официант / официантка",s:"от 65 000 ₽ в месяц + чаевые",g:"График 2/2, смены по 12 часов · официальное оформление",d:["Встречать гостей, принимать заказы и консультировать по меню","Сервировать столы, подавать блюда и напитки","Работать с кассой и принимать оплату"],r:["Опыт от 6 месяцев желателен, но обучим с нуля","Грамотная речь, аккуратный вид, стрессоустойчивость","Готовность работать в вечерние смены и по выходным"],o:["Оформление по ТК РФ, выплаты два раза в месяц","Бесплатное питание в смену и фирменная форма","Все чаевые остаются сотрудникам, обучение у шефа"]},zh:{t:"服务员",s:"月薪 65 000 ₽ 起 + 小费",g:"两天一休，每班12小时 · 正式签约",d:["迎宾、点单并介绍菜单","摆台，上菜上饮品","操作收银并收款"],r:["有6个月以上经验者优先，也接受零基础培训","表达清晰，仪表整洁，抗压能力强","可上晚班和周末班"],o:["按劳动法签订合同，每月发薪两次","班中免费工作餐，统一工服","小费全部归员工，主厨亲自培训"]}},
{ru:{t:"Курьер на личном автомобиле",s:"от 130 000 ₽ в месяц",g:"График 5/2 или 2/2, свободное расписание · оформление как самозанятый или ИП",d:["Доставлять заказы гостям по городу в термосумке","Следить за температурой и сохранностью блюд","Вежливо общаться с клиентами и принимать оплату"],r:["Личный легковой автомобиль в хорошем состоянии","Права категории B, стаж вождения от 2 лет","Статус самозанятого или ИП, смартфон с навигатором"],o:["Выплаты два раза в месяц, бонусы в часы пик","Термосумки и фирменную одежду выдаём","Ужин за счёт ресторана после смены"]},zh:{t:"自驾配送员",s:"月薪 130 000 ₽ 起",g:"五天工作两天休或两天一休，时间灵活 · 以自雇或个体户身份合作",d:["用保温箱把订单送到全市顾客手中","保证餐品温度和完好","礼貌与顾客沟通并收款"],r:["车况良好的私家轿车","B类驾照，驾龄2年以上","自雇或个体户身份，手机带导航"],o:["每月发薪两次，高峰期有奖金","提供保温箱和品牌服装","下班后餐厅提供晚餐"]}}];
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
let L="ru",cat=0,cart={};
const fmt=n=>n.toLocaleString('ru-RU')+' ₽';
const dn=(x)=>L==="ru"?x[3]:x[2];
function total(){let n=0,s=0;for(const k in cart){n+=cart[k];s+=cart[k]*D[k][8]}return{n,s}}
function renderTabs(){$('#tabs').innerHTML=T[L].cats.map((c,i)=>`<button class="tab ${i===cat?'on':''}" data-c="${i}">${c}</button>`).join('')}
function renderMenu(){
  $('#grid').innerHTML=D.map((x,i)=>[x,i]).filter(([x])=>!cat||x[0]===cat).map(([x,i],j)=>`
  <article class="dish" style="animation-delay:${j*50}ms">${x[9]?`<span class="hit">${T[L].hit}</span>`:''}
    <div class="ph">${x[10]?`<img src="${x[10]}" alt="${x[3]}">`:x[1]}</div>
    <div class="b">${L==="ru"?`<div class="cn">${x[2]}</div>`:''}<h3>${dn(x)}</h3>
    <div class="p">${x[4]}${L==="ru"?' · '+x[5]:''}</div><p class="d">${L==="ru"?x[6]:x[7]}</p>
    <div class="f"><span class="price">${fmt(x[8])}</span><button class="add" data-i="${i}">${T[L].add}</button></div></div>
  </article>`).join('');
}
function renderCart(){
  const t=total(),m=location.hash.startsWith('#/menu');
  $('#ct').textContent=`${T[L].inord}: ${t.n} · ${fmt(t.s)}`;
  $('#cart').classList.toggle('on',m&&t.n>0&&!$('#ov').classList.contains('on'));
  $('#tv').textContent=fmt(t.s);
  $('#il').innerHTML=Object.keys(cart).map(k=>`<div class="it"><span>${dn(D[k])}</span><span class="q"><button data-m="${k}" aria-label="−">−</button>${cart[k]}<button data-pl="${k}" aria-label="+">+</button><b>${fmt(cart[k]*D[k][8])}</b></span></div>`).join('');
}
function orderText(){
  const t=total();
  return `${T[L].ord}:\n`+Object.keys(cart).map(k=>`• ${dn(D[k])} ×${cart[k]} — ${fmt(cart[k]*D[k][8])}`).join('\n')+`\n${T[L].tt}: ${fmt(t.s)}\n${T[L].nmL}: ${$('#on').value}\n${T[L].phL}: ${$('#op').value}\n${T[L].consL}: ${new Date().toLocaleString('ru-RU')}`;
}
function applyLang(){
  const t=T[L];document.documentElement.lang=L==="ru"?"ru":"zh";
  $$('[data-i]').forEach(e=>{if(t[e.dataset.i]!==undefined&&!e.classList.contains('add'))e.textContent=t[e.dataset.i]});
  $$('[data-p]').forEach(e=>e.placeholder=t[e.dataset.p]);
  $$('[data-h]').forEach(e=>e.innerHTML=t[e.dataset.h]);
  $('#gs').innerHTML=t.gs.map(g=>`<option>${g}</option>`).join('');
  $$('.lg').forEach(b=>b.textContent=L==="ru"?"中文":"РУ");
  renderTabs();renderMenu();renderCart();renderExtra();
}
function renderExtra(){
  const t=T[L],sl=(i,a)=>`<div class="slot">${i?`<img src="${i}" alt="${a}">`:`<span>📷<br>${t.slot}</span>`}</div>`,li=a=>a.map(x=>`<li>${x}</li>`).join('');
  $('#stats').innerHTML=t.stats.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('');
  $('#chg').innerHTML=CH.map(c=>{const v=c[L];return `<article class="chef">${sl(c.img,v[0])}<div class="b"><h3>${v[0]}</h3><div class="r">${v[1]}</div><span class="x">${v[2]}</span><p>${v[3]}</p></div></article>`}).join('');
  $('#gal').innerHTML=GL.map(g=>`<figure>${sl(g.img,g[L])}<figcaption>${g[L]}</figcaption></figure>`).join('');
  $('#jl').innerHTML=J.map(j=>{const v=j[L];return `<article class="job"><h3>${v.t}</h3><div class="sal">${v.s}</div><div class="g">${v.g}</div><h4>${t.jd}</h4><ul>${li(v.d)}</ul><h4>${t.jr}</h4><ul>${li(v.r)}</ul><h4>${t.jo}</h4><ul>${li(v.o)}</ul><div class="row"><a class="btn" href="mailto:hr@redtiger.example?subject=${encodeURIComponent(v.t)}">${t.ja}</a><a class="btn o" href="tel:+74950000000">${t.jc}</a></div></article>`}).join('');
}
function route(){
  const h=location.hash,m=h.startsWith('#/menu')?'menu':h.startsWith('#/jobs')?'jobs':'home';
  $$('.page').forEach(p=>p.classList.toggle('on',p.id===m));
  $$('nav a[data-r]').forEach(a=>a.classList.toggle('on',a.dataset.r===m));
  renderCart();$('header').classList.remove('hide');scrollTo(0,0);
}
function go(id){
  if(location.hash.startsWith('#/menu')||location.hash.startsWith('#/jobs'))location.hash='#/';
  route();setTimeout(()=>{const el=document.getElementById(id);el&&el.scrollIntoView({behavior:'smooth',block:'center'})},60);
}
addEventListener('hashchange',route);
document.addEventListener('click',e=>{
  const c=e.target.closest('.tab'),a=e.target.closest('.add'),g=e.target.closest('[data-go]'),p=e.target.closest('[data-pl]'),m=e.target.closest('[data-m]');
  if(c){cat=+c.dataset.c;renderTabs();renderMenu()}
  else if(a){const i=a.dataset.i;cart[i]=(cart[i]||0)+1;renderCart();a.textContent=T[L].added;setTimeout(()=>a.textContent=T[L].add,1100)}
  else if(g){e.preventDefault();go(g.dataset.go)}
  else if(p){cart[p.dataset.pl]++;renderCart()}
  else if(m){const k=m.dataset.m;if(--cart[k]<=0)delete cart[k];renderCart();if(!total().n)$('#ov').classList.remove('on')}
});
document.addEventListener('click',e=>{const d=e.target.closest('[data-doc]');if(d){e.preventDefault();$('#dc').innerHTML=document.getElementById(d.dataset.doc).innerHTML;$('#dv').classList.add('on');$('#dv .dr').scrollTop=0}});
$('#dx').onclick=()=>$('#dv').classList.remove('on');
$('#dv').onclick=e=>{if(e.target.id==='dv')$('#dx').click()};
$$('.lg').forEach(b=>b.onclick=()=>{L=L==="ru"?"zh":"ru";applyLang()});
let ly=0;addEventListener('scroll',()=>{const y=scrollY,h=$('header');if(innerWidth<=760){if(y>ly&&y>80)h.classList.add('hide');else if(y<ly)h.classList.remove('hide')}else h.classList.remove('hide');ly=y},{passive:true});
$('#oc').onclick=()=>{$('#ov').classList.add('on');$('#om').textContent='';renderCart()};
$('#cl').onclick=()=>{$('#ov').classList.remove('on');renderCart()};
$('#ov').onclick=e=>{if(e.target.id==='ov')$('#cl').click()};
function need(){if(!$('#oa').checked){$('#om').textContent=T[L].needc;return true}if(!$('#on').value.trim()||!$('#op').value.trim()){$('#om').textContent=T[L].need;return true}}
$('#tg').onclick=()=>{
  if(need())return;
  const tx=orderText(),u=TG?`https://t.me/${TG}?text=${encodeURIComponent(tx)}`:`https://t.me/share/url?url=${encodeURIComponent(location.href.split('#')[0])}&text=${encodeURIComponent(tx)}`;
  window.open(u,'_blank','noopener');
};
$('#cp').onclick=async()=>{
  if(need())return;
  try{await navigator.clipboard.writeText(orderText());$('#om').textContent=T[L].copied}catch(e){$('#om').textContent=T[L].nocp}
};
$('#bf').addEventListener('submit',e=>{
  e.preventDefault();
  const o=$('#ok');o.style.display='block';o.textContent=T[L].thx($('#nm').value,$('#ph').value,$('#dt').value);e.target.reset();
});
$('#dt').min=new Date().toISOString().slice(0,10);
$('#embers').innerHTML=Array.from({length:16},()=>`<i class="ember" style="left:${Math.random()*100}%;animation-duration:${6+Math.random()*7}s;animation-delay:${Math.random()*8}s"></i>`).join('');
applyLang();route();
</script>
</body>
</html>
