<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Для тебя</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,400;1,500&family=Marck+Script&display=swap" rel="stylesheet">
<style>
:root{--bg:#0c0709;--plum:#2a1520;--pink:#ffb3c7;--pink2:#ff8fb0;--ink:#f3dfe6;--mut:#a98a97;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 40%,#2b1621 0%,#0c0709 70%)}
.scr{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center;opacity:0;pointer-events:none;transition:opacity .9s}
.scr.on{opacity:1;pointer-events:auto}
h1{font-weight:500;font-style:italic;font-size:clamp(26px,7vw,40px);margin:0 0 8px;line-height:1.15}
.sub{color:var(--mut);font-style:italic;font-size:19px;margin:0 0 26px}
input{width:min(320px,86vw);padding:15px 18px;border-radius:14px;border:1px solid #ffffff1a;background:#ffffff0d;color:var(--ink);font:italic 20px 'Cormorant Garamond',serif;text-align:center;outline:none;margin-bottom:14px}
input:focus{border-color:var(--pink)}
.btn{width:min(320px,86vw);padding:15px;border:0;border-radius:999px;background:linear-gradient(#ffc2d2,#ff8fb0);color:#3a1020;font:600 19px 'Cormorant Garamond',serif;box-shadow:0 8px 28px #ff8fb040;cursor:pointer}
.btn.small{width:auto;padding:12px 28px;font-size:17px}
.shake{animation:sh .45s}@keyframes sh{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.note{height:22px;margin-top:14px;color:var(--mut);font-style:italic}
/* envelope */
.env{position:relative;width:min(300px,80vw);height:200px;background:linear-gradient(#f6e6ea,#e7cfd6);border-radius:8px;box-shadow:0 20px 60px #000a;cursor:pointer;transition:transform .8s}
.env:before,.env:after{content:"";position:absolute;bottom:0;width:0;height:0;border-style:solid}
.env:before{left:0;border-width:100px 0 100px min(150px,40vw);border-color:transparent transparent transparent #ecd5db}
.env:after{right:0;border-width:100px min(150px,40vw) 100px 0;border-color:transparent #ecd5db transparent transparent}
.flap{position:absolute;top:0;left:0;width:100%;height:110px;background:#f1dce2;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s;z-index:2}
.env.open .flap{transform:rotateX(180deg);z-index:0}
.seal{position:absolute;left:50%;top:86px;width:46px;height:46px;margin:-23px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#b4324f,#6e1428);z-index:3;display:grid;place-items:center;color:#f7c6d1;font-size:20px;box-shadow:0 3px 8px #0006;transition:opacity .4s}
.env.open .seal{opacity:0}
.to{position:absolute;bottom:22px;width:100%;text-align:center;z-index:4;font-family:'Marck Script',cursive;font-size:28px;color:#6e1428}
/* letter */
.paper{width:min(420px,92vw);max-height:78vh;overflow:auto;background:#fbf3f0;color:#3a2229;border-radius:6px;padding:30px 26px;text-align:left;font-size:21px;line-height:1.45;box-shadow:0 30px 80px #000c;white-space:pre-wrap}
.paper b{display:block;font:400 30px 'Marck Script',cursive;margin-bottom:12px;color:#8a2a45}
canvas{position:fixed;inset:0;width:100%;height:100%;touch-action:none}
#hud{position:fixed;left:0;right:0;bottom:calc(26px + env(safe-area-inset-bottom,0px));text-align:center;pointer-events:none;opacity:0;transition:opacity 1s}
#hud.on{opacity:1}#hud .btn{pointer-events:auto}
#nm{font:400 44px 'Marck Script',cursive;margin:0;text-shadow:0 0 20px #ff8fb066;transition:opacity .8s}
#hint{color:var(--mut);font-style:italic;font-size:17px;margin:4px 0 16px;min-height:22px}
</style></head><body>

<section class="scr on" id="lock">
 <h1>Эта эмоция закрыта словом</h1>
 <p class="sub">слово, которое мы пишем друг другу чаще всего</p>
 <input id="ans" placeholder="слово" autocomplete="off" enterkeyhint="go">
 <button class="btn" id="go">Открыть</button>
 <div class="note" id="note"></div>
</section>

<section class="scr" id="mail">
 <div class="env" id="env"><div class="flap"></div><div class="seal">♥</div><div class="to" id="to"></div></div>
 <p class="sub" style="margin-top:26px" id="mailhint">нажми на конверт</p>
</section>

<section class="scr" id="letter">
 <div class="paper" id="paper"></div>
 <button class="btn small" id="next" style="margin-top:22px">дальше</button>
</section>

<section class="scr" id="gal"><canvas id="cv"></canvas>
 <div id="hud"><p id="nm"></p><p id="hint"></p><button class="btn small" id="miss">нажми, если скучаешь</button></div>
</section>

const $=id=>document.getElementById(id);
const show=id=>{document.querySelectorAll('.scr').forEach(s=>s.classList.remove('on'));$(id).classList.add('on')};
$('to').textContent=NAME;$('nm').textContent=NAME;
$('paper').textContent=LETTER;

function check(){
  const v=$('ans').value.trim().toLowerCase();
  if(v.includes(ANSWER)){ $('note').textContent='проверяю…'; setTimeout(()=>{show('mail')},900) }
  else{ const i=$('ans');i.classList.remove('shake');void i.offsetWidth;i.classList.add('shake');$('note').textContent='почти… подумай, что мы шлём друг другу' }
}
$('go').onclick=check;$('ans').addEventListener('keydown',e=>{if(e.key==='Enter')check()});

$('env').onclick=()=>{ if($('env').classList.contains('open'))return;
  $('env').classList.add('open');$('mailhint').textContent='открываю…';
  setTimeout(()=>show('letter'),1300)};
$('next').onclick=()=>{show('gal');startGalaxy()};

/* ====== ГАЛАКТИКА ====== */
let started=false;
function startGalaxy(){
  if(started){return}started=true;
  const cv=$('cv'),ctx=cv.getContext('2d');let W,H,dpr=Math.min(devicePixelRatio||1,2),cx,cy,R,fx0,fy0,fw,fh;
  const N=innerWidth<600?6000:9500;
  const sprites=[];
  function mkSprites(){
    const fs=18;PHRASES.forEach((p,k)=>{sprites[k]=[];[0.35,0.65,1].forEach(a=>{
      const c=document.createElement('canvas'),g=c.getContext('2d');g.font=`italic 500 ${fs*dpr}px 'Cormorant Garamond',Georgia,serif`;
      const w=Math.ceil(g.measureText(p).width)+4;c.width=w;c.height=Math.ceil(fs*1.3*dpr);
      g.font=`italic 500 ${fs*dpr}px 'Cormorant Garamond',Georgia,serif`;g.textBaseline='middle';
      g.fillStyle=`rgba(255,${200+Math.round(a*40)},${215+Math.round(a*30)},${a})`;g.fillText(p,2,c.height/2);sprites[k].push(c)})})}
  function size(){W=innerWidth;H=innerHeight;cv.width=W*dpr;cv.height=H*dpr;cx=W/2;cy=H*0.42;R=Math.min(W,H*0.8)*0.5;
    fw=Math.min(W*0.98,H*0.7/1.22);fh=fw*1.22;fx0=cx-fw/2;fy0=cy-fh/2-H*0.01}
  addEventListener('resize',()=>{size();placeFace()});size();
  const P=[];for(let i=0;i<N;i++){const arm=i%2,rr=Math.pow(Math.random(),0.65),g=(Math.random()+Math.random()+Math.random()-1.5)*0.35;
    P.push({k:i%3,r:rr,th:rr*4.4+arm*Math.PI+g*(1.2-rr),d:Math.random(),sc:0.34+Math.random()*0.28,fx:0,fy:0,fa:1,gl:(Math.random()-.5)})}
  let img=new Image(),gray=null,iw=360,ih=480;
  img.onload=()=>{const c=document.createElement('canvas');c.width=iw;c.height=ih;const g=c.getContext('2d');g.drawImage(img,0,0);gray=g.getImageData(0,0,iw,ih).data;placeFace()};img.src=PHOTO;
  function hal(i,b){let f=1,r=0;while(i>0){f/=b;r+=f*(i%b);i=Math.floor(i/b)}return r}
  function placeFace(){ if(!gray)return;
    const U0=.14,U1=.86,V0=.08,V1=.74;let hi=1;
    for(const p of P){let b=0,x,y,ok=false;
      for(let t=0;t<400&&!ok;t++){const u=U0+hal(hi,2)*(U1-U0),v=V0+hal(hi,3)*(V1-V0);hi++;
        x=Math.min(iw-1,u*iw|0);y=Math.min(ih-1,v*ih|0);b=gray[(y*iw+x)*4]/255;
        if(hal(hi*7+3,5)<Math.pow(b,1.5)*1.3){ok=true;p.fx=fx0+(u-U0)/(U1-U0)*fw;p.fy=fy0+(v-V0)/(V1-V0)*fh}}
      if(!ok){p.fx=cx;p.fy=cy;b=0}
      p.fa=b>0.62?2:b>0.3?1:0}}
  let settled=0,mix=0,target=0,rot=0,spin=0.0035,dragging=false,sx=0,lastX=0;
  const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
  function setTarget(t){target=t;$('hint').textContent=t?'проведи пальцем влево — и слова снова станут галактикой':'проведи вправо — и слова соберутся в тебя';
    $('nm').style.opacity=t?1:0;$('miss').textContent=t?'рассыпать':'нажми, если скучаешь'}
  setTarget(0);$('hud').classList.add('on');
  $('miss').onclick=()=>setTarget(target?0:1);
  cv.addEventListener('pointerdown',e=>{dragging=true;sx=lastX=e.clientX;cv.setPointerCapture(e.pointerId)});
  cv.addEventListener('pointermove',e=>{if(!dragging)return;if(!target)rot+=(e.clientX-lastX)*0.006;lastX=e.clientX});
  const up=e=>{if(!dragging)return;dragging=false;const dx=e.clientX-sx;if(dx>50)setTarget(1);else if(dx<-50)setTarget(0)};
  cv.addEventListener('pointerup',up);cv.addEventListener('pointercancel',()=>dragging=false);
  document.fonts.load("italic 500 18px 'Cormorant Garamond'").finally(()=>{mkSprites();loop()});
  function loop(){
    mix+=(target-mix)*0.045;if(Math.abs(target-mix)<0.001)mix=target;rot+=spin;
    if(mix===target&&target===1&&!dragging){if(settled++>40){requestAnimationFrame(loop);return}}else settled=0;
    ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle=(mix===1?'rgba(12,7,9,0.6)':'rgba(12,7,9,0.28)');ctx.fillRect(0,0,cv.width,cv.height);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    const gl=Math.sin(Math.PI*Math.min(1,Math.max(0,mix)))*(Math.abs(target-mix)>0.002?1:0);
    for(let i=0;i<N;i++){const p=P[i];
      const th=p.th+rot*(1.6/(0.25+p.r));const r=p.r*R;
      const gx=cx+Math.cos(th)*r,gy=cy+Math.sin(th)*r*0.6;
      let m=Math.min(1,Math.max(0,mix*1.5-p.d*0.5));m=ease(m);
      let x=gx+(p.fx-gx)*m,y=gy+(p.fy-gy)*m;
      x+=p.gl*70*gl;y+=p.gl*3*gl;
      const a=mix>0.5?p.fa:(p.r<0.3?2:p.r<0.65?1:0);const s=sprites[p.k][m>0.5?p.fa:a],sc=p.sc*(1-0.62*m);
      ctx.drawImage(s,x-s.width*sc/dpr/2,y-s.height*sc/dpr/2,s.width*sc/dpr,s.height*sc/dpr)}
    requestAnimationFrame(loop)}
}
</script>
